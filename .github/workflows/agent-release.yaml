name: Agent Release (Windows exe)

# Builds screenkonect-agent.exe so clients get a one-click download.
# - Every push to main (agent paths): builds + uploads exe as run artifact
# - Version tags (agent-v*): attaches exe to a GitHub Release (what the join page links to)

on:
  push:
    branches: [main]
    tags: ['agent-v*']
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
      - run: cargo build --release -p screenkonect-agent
      - run: dir target\release\screenkonect-agent.exe
      - uses: actions/upload-artifact@v4
        with:
          name: screenkonect-agent-windows
          path: target/release/screenkonect-agent.exe
          retention-days: 30

  release:
    name: Attach exe to Release
    if: startsWith(github.ref, 'refs/tags/agent-v')
    needs: [build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: screenkonect-agent-windows
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/screenkonect-agent.exe
          body: |
            One-click Windows agent. Client runs it, pastes the join link, done.
            No Rust / cargo needed on the client PC.
