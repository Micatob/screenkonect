port: 3000
host: "0.0.0.0"

database_url: "postgresql://screenkonect:screenkonect@localhost:5432/screenkonect"
redis_url: "redis://localhost:6379"

session_policy:
  default_expiry_minutes: 60
  max_expiry_minutes: 480
  idle_timeout_minutes: 15
  one_time_link_usage: true
  consent_timeout_ms: 300000
  require_client_approval: true
  allow_remote_control: true
  allow_file_transfer: false
  allow_clipboard_sync: false
  allow_recording: false
  require_recording_consent: true
  max_viewers_per_session: 5
  audit_log_retention_days: 90

security:
  jwt_access_secret: "CHANGE_ME_IN_PRODUCTION_MIN_32_CHARS_LONG"
  jwt_refresh_secret: "CHANGE_ME_IN_PRODUCTION_MIN_32_CHARS_LONG"
  bcrypt_salt_rounds: 12
  max_login_attempts: 5
  login_lockout_ms: 1800000
  token_expiry_ms: 900000
  refresh_token_expiry_days: 30
  cors_origins:
    - "http://localhost:5173"
    - "http://localhost:5174"
  rate_limit_window_ms: 60000
  rate_limit_max_requests: 100

observability:
  log_level: "info"
  enable_tracing: false
  enable_metrics: true
  metrics_port: 9090
