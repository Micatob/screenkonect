name: screenkonect

# Load .env from project root (one level up from deploy/)
# Ensures PUBLIC_URL etc. are read both locally and on VPS /opt/screenkonect
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: screenkonect
      POSTGRES_PASSWORD: screenkonect
      POSTGRES_DB: screenkonect
    ports:
      - "${SK_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U screenkonect"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "${SK_REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.base
    working_dir: /app
    command: sh -c "sleep 5 && npm run db:migrate -w @screenkonect/db && echo 'migrations done'"
    environment:
      DATABASE_URL: postgresql://screenkonect:screenkonect@postgres:5432/screenkonect
    volumes:
      - ..:/app
      - /app/node_modules
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  auth:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.base
    working_dir: /app
    command: npm start -w services/auth
    ports:
      - "${SK_AUTH_PORT:-4000}:4000"
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://screenkonect:screenkonect@postgres:5432/screenkonect
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-change-in-production-min-32-chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-in-production-min-32-chars}
      NODE_ENV: development
    volumes:
      - ..:/app
      - /app/node_modules
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/healthz | grep -q ok || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  session:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.base
    working_dir: /app
    command: npm start -w services/session
    ports:
      - "${SK_SESSION_PORT:-4001}:4001"
    env_file:
      - ../.env
    environment:
      PORT: 4001
      DATABASE_URL: postgresql://screenkonect:screenkonect@postgres:5432/screenkonect
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-change-in-production-min-32-chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-in-production-min-32-chars}
      NODE_ENV: development
    volumes:
      - ..:/app
      - /app/node_modules
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4001/healthz | grep -q ok || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  signaling:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.base
    working_dir: /app
    command: npm start -w services/signaling
    ports:
      - "${SK_SIGNALING_PORT:-4002}:4002"
    environment:
      PORT: 4002
      DATABASE_URL: postgresql://screenkonect:screenkonect@postgres:5432/screenkonect
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-change-in-production-min-32-chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-in-production-min-32-chars}
      NODE_ENV: development
    volumes:
      - ..:/app
      - /app/node_modules
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4002/healthz | grep -q ok || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  gateway:
    image: caddy:2-alpine
    ports:
      - "${SK_GATEWAY_PORT:-8090}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./downloads:/srv/downloads:ro
      # Prebuilt frontend dist (vite build) - served statically, no dev servers
      - ../apps/web-dashboard/dist:/srv/dashboard:ro
      - ../apps/client-consent-ui/dist:/srv/consent:ro
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
