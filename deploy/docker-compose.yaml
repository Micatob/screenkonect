name: screenkonect

# Load .env from project root (one level up from deploy/)
# Ensures PUBLIC_URL etc. are read both locally and on VPS /opt/screenkonect
services:
  postgres:
    image: postgres:16-alpine
    container_name: screenkonect-postgres
    environment:
      POSTGRES_USER: screenkonect
      POSTGRES_PASSWORD: screenkonect
      POSTGRES_DB: screenkonect
    ports:
      - "${SK_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U screenkonect"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: screenkonect-redis
    ports:
      - "${SK_REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.base
    container_name: screenkonect-migrate
    working_dir: /app
    command: sh -c "sleep 5 && npm run db:migrate -w @screenkonect/db && echo 'migrations done'"
    environment:
      DATABASE_URL: postgresql://screenkonect:screenkonect@postgres:5432/screenkonect
    volumes:
      - ..:/app
      - /app/node_modules
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  auth:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.base
    container_name: screenkonect-auth
    working_dir: /app
    command: npm run dev -w services/auth
    ports:
      - "${SK_AUTH_PORT:-4000}:4000"
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://screenkonect:screenkonect@postgres:5432/screenkonect
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-change-in-production-min-32-chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-in-production-min-32-chars}
      NODE_ENV: development
    volumes:
      - ..:/app
      - /app/node_modules
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/healthz | grep -q ok || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  session:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.base
    container_name: screenkonect-session
    working_dir: /app
    command: npm run dev -w services/session
    ports:
      - "${SK_SESSION_PORT:-4001}:4001"
    env_file:
      - ../.env
    environment:
      PORT: 4001
      DATABASE_URL: postgresql://screenkonect:screenkonect@postgres:5432/screenkonect
      REDIS_URL: redis://redis:6379
      PUBLIC_URL: ${PUBLIC_URL:-}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-change-in-production-min-32-chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-in-production-min-32-chars}
      NODE_ENV: development
    volumes:
      - ..:/app
      - /app/node_modules
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4001/healthz | grep -q ok || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  signaling:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.base
    container_name: screenkonect-signaling
    working_dir: /app
    command: npm run dev -w services/signaling
    ports:
      - "${SK_SIGNALING_PORT:-4002}:4002"
    environment:
      PORT: 4002
      DATABASE_URL: postgresql://screenkonect:screenkonect@postgres:5432/screenkonect
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-change-in-production-min-32-chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-in-production-min-32-chars}
      NODE_ENV: development
    volumes:
      - ..:/app
      - /app/node_modules
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4002/healthz | grep -q ok || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  web-dashboard:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.base
    container_name: screenkonect-web-dashboard
    working_dir: /app
    command: npm run dev -w apps/web-dashboard
    ports:
      - "${SK_DASHBOARD_PORT:-5173}:5173"
    environment:
      VITE_API_TARGET: http://auth:4000
      VITE_AUTH_TARGET: http://auth:4000
      VITE_SESSION_TARGET: http://session:4001
      VITE_SIGNALING_TARGET: ws://signaling:4002
      NODE_ENV: development
    volumes:
      - ..:/app
      - /app/node_modules
    restart: unless-stopped
    depends_on:
      - auth
      - session
      - signaling

  client-consent-ui:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.base
    container_name: screenkonect-client-consent-ui
    working_dir: /app
    command: npm run dev -w apps/client-consent-ui
    ports:
      - "${SK_CONSENT_PORT:-5174}:5174"
    environment:
      VITE_API_TARGET: http://auth:4000
      VITE_AUTH_TARGET: http://auth:4000
      VITE_SESSION_TARGET: http://session:4001
      VITE_SIGNALING_TARGET: ws://signaling:4002
      NODE_ENV: development
    volumes:
      - ..:/app
      - /app/node_modules
    restart: unless-stopped
    depends_on:
      - auth
      - session

  gateway:
    image: caddy:2-alpine
    container_name: screenkonect-gateway
    ports:
      - "${SK_GATEWAY_PORT:-8090}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    restart: unless-stopped
    depends_on:
      - web-dashboard
      - client-consent-ui
      - signaling
      - auth
      - session

volumes:
  postgres_data:
  redis_data:
